name: CI/CD Pipeline - Multi-Account Finance Agent

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Linters & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black bandit safety pytest pytest-asyncio

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Black Code Formatter Check
        run: black --check .

      - name: Security Vulnerability Scan (Bandit & Safety)
        run: |
          bandit -r src/ -ll
          # safety check

      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Lint Frontend (TypeScript & ESLint)
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm ci
            npm run lint
          fi

  automated-tests:
    name: Integration & Unit Tests
    needs: code-quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_finance_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PyTest Test Suite
        env:
          AUTH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/test_finance_db
          DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/test_finance_db
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          WEBHOOK_SIGNING_SECRET: test-secret
          OPENAI_API_KEY: mock-key
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pytest tests/ -v --maxfail=1

  cloud-deploy:
    name: Automatic Continuous Deployment to Oracle Cloud (24/7 Always Free)
    needs: automated-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud Always Free VM
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          if [ -z "$ORACLE_HOST" ] || [ -z "$ORACLE_SSH_KEY" ]; then
            echo "Skipping deployment: Oracle Cloud secrets not configured"
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

          echo "🚀 Syncing application code to Oracle Cloud VM..."
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            -e "ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no" \
            ./ "$ORACLE_USER@$ORACLE_HOST:/home/ubuntu/app/"

          echo "🔄 Rebuilding and restarting services..."
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no "$ORACLE_USER@$ORACLE_HOST" "
            set -e
            cd /home/ubuntu/app
            
            # Rebuild and restart API, Worker, and Frontend
            docker compose up -d --build api worker frontend
            
            # Run database migrations
            docker compose exec -T api alembic upgrade head || true
            
            # Health check probe
            echo '🏥 Verifying service liveness and readiness...'
            sleep 5
            curl -f http://localhost:8000/health || (docker logs finance_api --tail 50 && exit 1)
            echo '✅ Deployment to Oracle Cloud Always Free completed successfully!'
          "
